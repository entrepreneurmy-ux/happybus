<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HappyBus | Sign Up</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">HappyBus</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="signup.html" class="active">Sign Up</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="signupcard">
            <h2>Create Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.25rem;">Sign up to manage your bookings.</p>
            
            <form action="/signup" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>

                <button type="submit">Sign Up</button>
            </form>

            <div id="message">
                <span style="font-size: 0.85rem; color: var(--text-secondary);">
                    Already have an account? <a href="login.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Login here</a>
                </span>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 HappyBus. All rights reserved.</p>
    </footer>

</body>
</html>
