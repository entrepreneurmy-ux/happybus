services:
  db:
    image: postgres:15-alpine
    container_name: postgresql
    restart: always
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbuserpass
      POSTGRES_DB: happybus_db
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Change 'localhost' to 'db' so FastAPI connects to the postgres container
      - DATABASE_URL=postgresql://dbuser:dbuserpass@db:5432/happybus_db
    depends_on:
      - db

volumes:
  postgresql_data: