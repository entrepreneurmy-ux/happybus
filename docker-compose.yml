services:
  db:
    image: postgres:15-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbuserpass
      POSTGRES_DB: happybus_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dbuser:dbuserpass@db:5432/happybus_db
    volumes:
      - ./backend:/backend
      - ./frontend:/frontend
    depends_on:
      - db

volumes:
  postgres_data: