<header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo (Left) -->
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-amber-500/20">
          <i data-lucide="bus" class="w-6 h-6 stroke-[2.5]"></i>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight text-slate-900">Happy<span class="text-amber-500">Bus</span></span>
        </div>
      </a>

      <!-- Right-Aligned Container -->
      <div class="flex items-center ml-auto">
        
        <!-- Desktop Sign Out Button -->
        <button onclick="handleSignOut()" class="hidden sm:flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-red-600 bg-slate-100 hover:bg-red-50 px-3 py-2 rounded-xl transition cursor-pointer border border-slate-200">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>Sign Out</span>
        </button>

        <!-- Mobile Menu Button (Right Aligned) -->
        <div class="flex sm:hidden">
          <button id="mobile-menu-button" type="button" class="p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500" aria-label="Toggle Menu">
            <i data-lucide="menu" id="menu-icon" class="w-6 h-6"></i>
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu (Right-Aligned Content) -->
  <div id="mobile-menu" class="hidden sm:hidden bg-white border-b border-slate-200 px-4 pt-2 pb-4 space-y-1 shadow-lg">
    <div class="flex flex-col items-end">
      <button onclick="handleSignOut()" class="w-full flex items-center justify-end gap-2.5 px-3 py-2.5 rounded-lg text-sm font-semibold text-red-600 hover:bg-red-50 cursor-pointer bg-transparent border-none text-right">
        <i data-lucide="log-out" class="w-4 h-4"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</header>

<script>
  // Simple toggle script for the mobile menu dropdown
  document.getElementById('mobile-menu-button')?.addEventListener('click', function() {
    const mobileMenu = document.getElementById('mobile-menu');
    mobileMenu.classList.toggle('hidden');
  });
</script>
