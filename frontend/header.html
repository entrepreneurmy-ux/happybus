<!--
This is the updated responsive header component of the HappyBus website. 
Includes desktop and mobile language selector for English, Malay, and Chinese.
-->

<header class="pub-header">
  <div class="pub-container">
    <div class="pub-flex-row">
      
      <!-- Brand Logo -->
      <a href="index.html" class="pub-brand">
        <div class="pub-logo-box">
          <i data-lucide="bus" style="width: 24px; height: 24px; stroke-width: 2.5;"></i>
        </div>
        <div>
          <span class="pub-brand-text">Happy<span class="pub-brand-highlight">Bus</span></span>
        </div>
      </a>

      <!-- Desktop Navigation Links & Controls -->
      <div class="pub-desktop-controls">
        <nav class="pub-nav-bar">
          <a href="index.html" class="nav-link pub-nav-link" data-page="index.html">
            <i data-lucide="home" style="width: 14px; height: 14px;"></i> <span data-i18n="navHome">Home</span>
          </a>
          <a href="signup.html" class="nav-link pub-nav-link" data-page="signup.html">
            <i data-lucide="user-plus" style="width: 14px; height: 14px;"></i> <span data-i18n="navSignUp">Sign Up</span>
          </a>
          <a href="signin.html" class="nav-link pub-nav-link" data-page="signin.html">
            <i data-lucide="log-in" style="width: 14px; height: 14px;"></i> <span data-i18n="navSignIn">Sign In</span>
          </a>
        </nav>

        <!-- Language Switcher Dropdown -->
        <select id="langSwitcher" onchange="changeLanguage(this.value)" class="pub-lang-select">
          <option value="en">EN</option>
          <option value="ms">MY</option>
          <option value="zh">CN</option>
        </select>
      </div>

      <!-- Mobile Controls (Menu Button + Lang Switcher) -->
      <div class="pub-mobile-controls">
        <select id="langSwitcherMobile" onchange="changeLanguage(this.value)" class="pub-lang-select" style="padding: 0.375rem 0.5rem; border-radius: 0.5rem;">
          <option value="en">EN</option>
          <option value="ms">MY</option>
          <option value="zh">CN</option>
        </select>

        <button id="mobile-menu-button" type="button" class="pub-mobile-btn" aria-label="Toggle Menu">
          <i data-lucide="menu" id="menu-icon" style="width: 24px; height: 24px;"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown Menu (Hidden by default) -->
  <div id="mobile-menu" class="pub-mobile-dropdown hidden">
    <a href="index.html" class="nav-link pub-mobile-nav-link" data-page="index.html">
      <i data-lucide="home" style="width: 16px; height: 16px;"></i> <span data-i18n="navHome">Home</span>
    </a>
    <a href="signup.html" class="nav-link pub-mobile-nav-link" data-page="signup.html">
      <i data-lucide="user-plus" style="width: 16px; height: 16px;"></i> <span data-i18n="navSignUp">Sign Up</span>
    </a>
    <a href="signin.html" class="nav-link pub-mobile-nav-link" data-page="signin.html">
      <i data-lucide="log-in" style="width: 16px; height: 16px;"></i> <span data-i18n="navSignIn">Sign In</span>
    </a>
  </div>
</header>
