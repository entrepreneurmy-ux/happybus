<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus | Admin Overview</title>

  <!-- Tailwind CSS CDN (kept for structural helpers if needed) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Supabase JS Client SDK & Centralized Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <script src="/assets/js/supabase-client.js"></script>

  <!-- Instant Flicker-Free Layout Shell Script -->
  <script src="/assets/js/layout-shell.js"></script>
</head>
<body class="admin-body">

  <!-- GLOBAL NAVIGATION HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <!-- Layout Container with Sidebar and Main Content -->
  <div class="admin-layout-container">
    
    <!-- Left Sidebar Placeholder -->
    <div id="sidebar-placeholder"></div>

    <!-- Overview Main Content -->
    <main class="admin-main-content">

      <!-- Page Banner Header -->
      <div class="admin-banner">
        <div>
          <h2 class="admin-banner-title">Executive Command Center</h2>
          <p class="admin-banner-subtitle">Live operational oversight & business performance summary</p>
        </div>
        <button onclick="alert('Dispatch Broadcast Alert')" class="admin-alert-btn">
          <i data-lucide="radio" class="admin-icon-sm"></i> Broadcast Bus Alert
        </button>
      </div>

      <!-- Quick KPI Summary -->
      <div class="admin-kpi-grid">
        <div class="admin-kpi-card">
          <span class="admin-kpi-label">Total Active Students</span>
          <div class="admin-kpi-value">1,248</div>
          <span class="admin-kpi-trend-emerald">↑ +12% this month</span>
        </div>
        <div class="admin-kpi-card">
          <span class="admin-kpi-label">Monthly Revenue</span>
          <div class="admin-kpi-value">$74,880</div>
          <span class="admin-kpi-trend-emerald">100% Collected</span>
        </div>
        <div class="admin-kpi-card">
          <span class="admin-kpi-label">Avg On-Time Arrival</span>
          <div class="admin-kpi-value">98.2%</div>
          <span class="admin-kpi-trend-emerald">Target &gt;95%</span>
        </div>
        <div class="admin-kpi-card">
          <span class="admin-kpi-label">Bus Health Score</span>
          <div class="admin-kpi-value">91 / 100</div>
          <span class="admin-kpi-trend-amber">3 Buses Scheduled Repair</span>
        </div>
      </div>

    </main>
  </div>
</body>
</html>
