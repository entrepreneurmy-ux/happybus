<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus | Sign In</title>
  
  <!-- Tailwind CSS CDN & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Supabase JS Client SDK & Centralized Client Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <script src="/assets/js/supabase-client.js"></script>
</head>
<body class="page-body">
  
  <!-- GLOBAL NAVIGATION HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <main class="signin-main">
    <div class="signin-wrapper">
      <div class="signin-card">
        <div class="signin-header">
          <h2 class="signin-title">Welcome Back</h2>
          <p class="signin-subtitle">Sign in to your HappyBus account</p>
        </div>

        <form onsubmit="handleLogin(event)" class="signin-form">
          <div>
            <label class="signin-label">Email Address</label>
            <input type="email" id="loginEmail" required placeholder="alex@example.com" class="signin-input">
          </div>
          <div>
            <div class="signin-label-row">
              <label class="signin-label" style="margin-bottom: 0;">Password</label>
              <a href="reset-password.html" class="signin-link">Reset Password?</a>
            </div>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="signin-input">
          </div>

          <!-- Error message container -->
          <div id="error-message" class="signin-error-msg hidden"></div>

          <button type="submit" class="signin-submit-btn">
            Sign In
          </button>

          <!-- Supabase Authorization Badge -->
          <div class="signin-auth-badge">
            <span>Secured by</span>
            <span class="signin-auth-brand">Supabase Auth</span>
          </div>
        </form>

      </div>
    </div>
  </main>

  <script>
    // 1. Script to load the centralized header dynamically with cache-buster
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('header.html?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load header.html');
        
        const html = await response.text();
        document.getElementById('header-placeholder').outerHTML = html;

        // Highlight active nav item based on current file name
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.getAttribute('data-page') === currentPage) {
            link.style.backgroundColor = 'var(--color-amber-500)';
            link.style.color = 'var(--color-slate-950)';
          }
        });

        // Re-initialize Lucide icons for the injected header
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }

        // ─── MOBILE MENU TOGGLE ───
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (menuButton && mobileMenu) {
          menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
          });
        }
      } catch (error) {
        console.error('Error loading navigation header:', error);
      }
    });

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('error-message');
      
      errorDiv.classList.add('hidden');

      try {
        // 1. Authenticate via Supabase sign-in
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.classList.remove('hidden');
          return;
        }

        if (data.session) {
          const userId = data.user.id;

          // 2. Fetch the user's role from the public.profiles table
          const { data: profile, error: profileError } = await supabaseClient
            .from('profiles')
            .select('role')
            .eq('id', userId)
            .single();

          const role = profile?.role || 'parent';

          // 3. Route based on role
          if (role === 'admin') {
            window.location.href = 'admin-dashboard.html';
          } else if (role === 'driver') {
            window.location.href = 'driver-dashboard.html';
          } else {
            window.location.href = 'parent-dashboard.html';
          }
        }
      } catch (err) {
        console.error("Sign In error:", err);
        errorDiv.innerText = "Invalid email or password.";
        errorDiv.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
