<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus | Sign In</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
            slate: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>

  <!-- External Fonts -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="frontend/assets/css/style.css">

  <!-- Clerk Frontend SDK -->
  <script async crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" data-clerk-publishable-key="pk_test_c2F2ZWQtc3RvcmstODQ4MC5jbGVyay5hY2NvdW50cy5kZXYk"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  
  <!-- GLOBAL NAVIGATION HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <main class="flex-grow py-16">
    <div class="max-w-md mx-auto px-4">
      <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200 space-y-6">
        <div class="text-center space-y-2">
          <h2 class="text-3xl font-black text-slate-900">Welcome Back</h2>
          <p class="text-sm text-slate-500">Sign in to your HappyBus account</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
            <input type="email" id="loginEmail" required placeholder="alex@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-amber-500">
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs font-bold text-slate-700">Password</label>
              <a href="reset-password.html" class="text-xs font-bold text-amber-600 hover:underline">Reset Password?</a>
            </div>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-amber-500">
          </div>

          <!-- Error message container -->
          <div id="error-message" class="text-xs text-rose-500 font-semibold hidden"></div>

          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-md transition">
            Sign In
          </button>

          <!-- Clerk Authorization Badge -->
          <a href="https://clerk.com/legal/standard-terms" target="_blank" rel="noopener noreferrer" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; color: #4b5563; text-align: center; margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
            <span>Secured by</span>
            <span style="display: inline-flex; align-items: center; gap: 5px; color: #111827; font-size: 16px; font-weight: 700;">
              <!-- Local SVG File Reference -->
              <img src="/assets/svg/symbol-dark.svg" alt="Clerk logo" style="height: 16px; width: auto; vertical-align: middle;" />
              clerk
            </span>
          </a>
        </form>

      </div>
    </div>
  </main>

  <script>
    // 1. Script to load the centralized header dynamically with cache-buster
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('header.html?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load header.html');
        
        const html = await response.text();
        document.getElementById('header-placeholder').outerHTML = html;

        // Highlight active nav item based on current file name
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.getAttribute('data-page') === currentPage) {
            link.className = "nav-link px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow-sm flex items-center gap-1.5";
          }
        });

        // Re-initialize Lucide icons for the injected header
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      } catch (error) {
        console.error('Error loading navigation header:', error);
      }
    });

    // 2. Initialize Clerk Auth & Auto-clear lingering sessions
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    window.addEventListener('load', async function () {
      await window.Clerk.load();

      // If a lingering session exists on load, sign out automatically
      if (window.Clerk.session) {
        await window.Clerk.signOut();
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('error-message');
      
      errorDiv.classList.add('hidden');

      try {
        // Authenticate via Clerk sign-in attempt
        const signInAttempt = await window.Clerk.client.signIn.create({
          identifier: email,
          password: password,
        });

        if (signInAttempt.status === "complete") {
          await window.Clerk.setActive({ session: signInAttempt.createdSessionId });

          // Retrieve user role from unsafeMetadata (safely readable on frontend)
          const user = window.Clerk.user;
          const role = user?.unsafeMetadata?.role || 'parent';

          if (role === 'admin') {
            window.location.href = 'admin_dashboard.html';
          } else if (role === 'driver') {
            window.location.href = 'driver_dashboard.html';
          } else {
            window.location.href = 'parent_dashboard.html';
          }
        } else {
          errorDiv.innerText = "Sign in status: " + signInAttempt.status;
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        console.error("Sign In error:", err);
        errorDiv.innerText = err.errors?.[0]?.message || "Invalid email or password.";
        errorDiv.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
