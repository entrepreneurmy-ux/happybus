<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus | Sign Up</title>
  
  <!-- Tailwind CSS CDN & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Supabase JS Client SDK & Centralized Client Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <script src="/assets/js/supabase-client.js"></script>
</head>
<body class="page-body">

  <!-- GLOBAL NAVIGATION HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <main class="signup-main">
    <div class="signup-wrapper">
      <div class="signup-card">
        <div class="signup-header">
          <h2 class="signup-title">Create Account</h2>
          <p class="signup-subtitle">Enter your details and pre-registered phone number</p>
        </div>

        <form onsubmit="handleSignup(event)" class="signup-form">
          <div class="signup-grid-cols">
            <div>
              <label class="signup-label">First Name</label>
              <input type="text" id="firstName" required placeholder="Alex" class="signup-input">
            </div>
            <div>
              <label class="signup-label">Last Name</label>
              <input type="text" id="lastName" required placeholder="Tan" class="signup-input">
            </div>
          </div>

          <div>
            <label class="signup-label">Email Address</label>
            <input type="email" id="email" required placeholder="alextan@example.com" class="signup-input">
          </div>

          <div>
            <label class="signup-label">Phone Number (Pre-registered by Operator)</label>
            <input type="tel" id="phoneNumber" required placeholder="0123456789" class="signup-input signup-input-bold">
            <p class="signup-helper-text">Enter your mobile number as registered by the operator (e.g., 0123456789)</p>
          </div>

          <div>
            <label class="signup-label">Create Password</label>
            <input type="password" id="signupPass" oninput="checkPasswordStrength()" required class="signup-input">
            <div class="signup-strength-container">
              <div class="signup-strength-track">
                <div id="strengthBar" class="signup-strength-bar"></div>
              </div>
              <span id="strengthText" class="signup-strength-text">Weak</span>
            </div>
          </div>

          <!-- Hidden Verification Code Section -->
          <div id="verification-section" class="signup-verification-box hidden">
            <label class="signup-label">Enter Verification Code sent to your Email</label>
            <input type="text" id="verificationCode" placeholder="123456" class="signup-input">
            <button type="button" onclick="verifyEmail()" class="signup-verify-btn">
              Verify & Complete
            </button>
          </div>

          <!-- Error message container -->
          <div id="error-message" class="signup-error-msg hidden"></div>

          <button type="submit" id="submitBtn" class="signup-submit-btn">
            Sign Up
          </button>
          
          <!-- Supabase Authorization Badge -->
          <div class="signup-auth-badge">
            <span>Secured by</span>
            <span class="signup-auth-brand">Supabase Auth</span>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    // 1. Script to load the centralized header dynamically with cache-buster
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('header.html?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load header.html');
        
        const html = await response.text();
        document.getElementById('header-placeholder').outerHTML = html;

        // Highlight active nav item based on current file name
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.getAttribute('data-page') === currentPage) {
            link.style.backgroundColor = 'var(--color-amber-500)';
            link.style.color = 'var(--color-slate-950)';
          }
        });

        // Re-initialize Lucide icons for the injected header
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }

        // ─── MOBILE MENU TOGGLE ───
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (menuButton && mobileMenu) {
          menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
          });
        }
      } catch (error) {
        console.error('Error loading navigation header:', error);
      }
    });

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    function checkPasswordStrength() {
      const val = document.getElementById('signupPass').value;
      const bar = document.getElementById('strengthBar');
      const txt = document.getElementById('strengthText');
      if (val.length > 8) {
        bar.style.width = '100%';
        bar.style.backgroundColor = '#10b981';
        txt.innerText = 'Strong';
      } else if (val.length > 4) {
        bar.style.width = '50%';
        bar.style.backgroundColor = 'var(--color-amber-500)';
        txt.innerText = 'Medium';
      } else {
        bar.style.width = '20%';
        bar.style.backgroundColor = '#ef4444';
        txt.innerText = 'Weak';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phoneNumber = document.getElementById('phoneNumber').value.trim();
      const password = document.getElementById('signupPass').value;
      const errorDiv = document.getElementById('error-message');
      
      errorDiv.classList.add('hidden');

      try {
        // 1. Verify if the phone number exists in the profiles table (pre-registered by operator)
        const { data: existingProfiles, error: queryError } = await supabaseClient
          .from('profiles')
          .select('id, phone')
          .eq('phone', phoneNumber);

        if (queryError || !existingProfiles || existingProfiles.length === 0) {
          errorDiv.innerText = "This phone number is not pre-registered by your bus operator. Please contact support.";
          errorDiv.classList.remove('hidden');
          return;
        }

        // 2. Proceed with Supabase sign up if phone is verified
        const { data, error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: `${firstName} ${lastName}`,
              phone: phoneNumber,
              role: 'parent'
            },
            emailRedirectTo: `${window.location.origin}/parent-dashboard.html`
          }
        });

        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.classList.remove('hidden');
          return;
        }

        if (data.session) {
          window.location.href = 'parent-dashboard.html';
        } else {
          errorDiv.style.color = '#059669';
          errorDiv.innerText = "Account created! Please check your email for the verification code.";
          errorDiv.classList.remove('hidden');

          document.getElementById('verification-section').classList.remove('hidden');
          document.getElementById('submitBtn').classList.add('hidden');
        }
      } catch (err) {
        console.error("Signup error:", err);
        errorDiv.innerText = "Something went wrong during signup.";
        errorDiv.classList.remove('hidden');
      }
    }

    async function verifyEmail() {
      const email = document.getElementById('email').value.trim();
      const code = document.getElementById('verificationCode').value.trim();
      const errorDiv = document.getElementById('error-message');

      try {
        const { data, error } = await supabaseClient.auth.verifyOtp({
          email: email,
          token: code,
          type: 'signup'
        });

        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.classList.remove('hidden');
        } else {
          window.location.href = 'parent-dashboard.html';
        }
      } catch (err) {
        console.error("Verification error:", err);
        errorDiv.innerText = "Invalid verification code.";
        errorDiv.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
