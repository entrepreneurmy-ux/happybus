<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus - Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
            slate: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-amber-500/20">
            <i data-lucide="bus" class="w-6 h-6 stroke-[2.5]"></i>
          </div>
          <span class="text-xl font-extrabold tracking-tight text-slate-900">Happy<span class="text-amber-500">Bus</span></span>
        </a>
        <nav class="hidden lg:flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/80">
          <a href="index.html" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">Landing</a>
          <a href="login.html" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900">Login</a>
          <a href="signup.html" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow-sm">Sign Up</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="flex-grow py-16">
    <div class="max-w-lg mx-auto px-4">
      <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200 space-y-6">
        <div class="text-center space-y-2">
          <h2 class="text-3xl font-black text-slate-900">Create Account</h2>
          <p class="text-sm text-slate-500">Register as a Parent or Driver to get started</p>
        </div>

        <form onsubmit="handleSignup(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">First Name</label>
              <input type="text" required placeholder="Sarah" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-amber-500">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Last Name</label>
              <input type="text" required placeholder="Jenkins" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-amber-500">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
            <input type="email" required placeholder="sarah@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-amber-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Account Role</label>
            <select id="roleSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm font-bold">
              <option value="parent">Parent / Guardian</option>
              <option value="driver">Bus Driver / Operator</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Create Password</label>
            <input type="password" id="signupPass" oninput="checkPasswordStrength()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-amber-500">
            <div class="mt-2 flex items-center gap-2">
              <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div id="strengthBar" class="h-full bg-slate-300 w-0 transition-all"></div>
              </div>
              <span id="strengthText" class="text-xs font-bold text-slate-400">Weak</span>
            </div>
          </div>

          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-md transition">
            Complete Registration
          </button>
        </form>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function checkPasswordStrength() {
      const val = document.getElementById('signupPass').value;
      const bar = document.getElementById('strengthBar');
      const txt = document.getElementById('strengthText');
      if (val.length > 8) {
        bar.style.width = '100%';
        bar.className = 'h-full bg-emerald-500 transition-all';
        txt.innerText = 'Strong';
      } else if (val.length > 4) {
        bar.style.width = '50%';
        bar.className = 'h-full bg-amber-500 transition-all';
        txt.innerText = 'Medium';
      } else {
        bar.style.width = '20%';
        bar.className = 'h-full bg-rose-500 transition-all';
        txt.innerText = 'Weak';
      }
    }

    function handleSignup(e) {
      e.preventDefault();
      const role = document.getElementById('roleSelect').value;
      window.location.href = `${role}-dashboard.html`;
    }
  </script>
</body>
</html>
