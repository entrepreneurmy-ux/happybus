<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus | Reset Password</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
            slate: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  
  <!-- Centralized Supabase Client Script -->
  <script src="/assets/js/supabase-client.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">
  
  <!-- GLOBAL NAVIGATION HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <main class="flex-grow py-16">
    <div class="max-w-md mx-auto px-4">
      <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200 space-y-6">
        
        <div class="text-center space-y-2">
          <h2 class="text-3xl font-black text-slate-900">Reset Password</h2>
          <p id="instruction-text" class="text-sm text-slate-500">Enter your email address and we'll send you a password reset link.</p>
        </div>

        <!-- Request Reset Form -->
        <form id="request-form" onsubmit="handlePasswordResetRequest(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
            <input type="email" id="resetEmail" required placeholder="alex@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-amber-500">
          </div>

          <!-- Error message container -->
          <div id="error-message" class="text-xs text-rose-500 font-semibold hidden"></div>

          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-md transition">
            Send Reset Link
          </button>
        </form>

        <!-- New Password Form (Hidden by default, shown when user lands via recovery token link) -->
        <form id="update-form" onsubmit="handlePasswordUpdate(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
            <input type="password" id="newPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-amber-500">
          </div>

          <!-- Update Error message container -->
          <div id="update-error-message" class="text-xs text-rose-500 font-semibold hidden"></div>

          <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-md transition">
            Update Password
          </button>
        </form>

        <!-- Supabase Authorization Badge -->
        <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; color: #4b5563; text-align: center; margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <span>Secured by</span>
          <span style="color: #111827; font-size: 15px; font-weight: 700;">Supabase Auth</span>
        </div>

      </div>
    </div>
  </main>

<script>
    // 1. Script to load the centralized header dynamically with cache-buster
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('header.html?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load header.html');
        
        const html = await response.text();
        const placeholder = document.getElementById('header-placeholder');
        if (placeholder) {
          placeholder.innerHTML = html;
        }

        // Highlight active nav item based on current file name
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.getAttribute('data-page') === currentPage) {
            link.className = "nav-link px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow-sm flex items-center gap-1.5";
          }
        });

        // Re-initialize Lucide icons for the injected header
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }

        // ─── MOBILE MENU TOGGLE ───
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (menuButton && mobileMenu) {
          menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
          });
        }
      } catch (error) {
        console.error('Error loading navigation header:', error);
      }
    });

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    // Check if the user arrived here via an email recovery link (Supabase sends recovery tokens in the URL hash)
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash && hash.includes('type=recovery')) {
        // Switch views: hide request form, show update password form
        document.getElementById('request-form').classList.add('hidden');
        document.getElementById('update-form').classList.remove('hidden');
        document.getElementById('instruction-text').innerText = "Enter your new password below.";
      }
    });

    // Step 1: Send Password Reset Request Email
    async function handlePasswordResetRequest(e) {
      e.preventDefault();
      
      const email = document.getElementById('resetEmail').value.trim();
      const errorDiv = document.getElementById('error-message');
      
      errorDiv.classList.add('hidden');

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/reset-password.html`,
        });

        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.classList.remove('hidden');
          return;
        }

        errorDiv.className = "text-xs text-emerald-600 font-semibold";
        errorDiv.innerText = "Password reset instructions have been sent to your email.";
        errorDiv.classList.remove('hidden');
      } catch (err) {
        console.error("Reset password error:", err);
        errorDiv.className = "text-xs text-rose-500 font-semibold";
        errorDiv.innerText = "Something went wrong. Please try again.";
        errorDiv.classList.add('hidden');
      }
    }

    // Step 2: Update Password (after clicking email link)
    async function handlePasswordUpdate(e) {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const errorDiv = document.getElementById('update-error-message');
      
      errorDiv.classList.add('hidden');

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.classList.remove('hidden');
          return;
        }

        errorDiv.className = "text-xs text-emerald-600 font-semibold";
        errorDiv.innerText = "Password updated successfully! Redirecting to sign in...";
        errorDiv.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'signin.html';
        }, 2000);
      } catch (err) {
        console.error("Update password error:", err);
        errorDiv.className = "text-xs text-rose-500 font-semibold";
        errorDiv.innerText = "Failed to update password.";
        errorDiv.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
