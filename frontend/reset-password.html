<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus | Reset Password</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
            slate: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>

  <!-- External Fonts -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="frontend/assets/css/style.css">

  <!-- Clerk Frontend SDK -->
  <script async crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" data-clerk-publishable-key="pk_test_c2F2ZWQtc3RvcmstODQ4MC5jbGVyay5hY2NvdW50cy5kZXYk"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- GLOBAL NAVIGATION HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <main class="flex-grow py-16">
    <div class="max-w-lg mx-auto px-4">
      <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200 space-y-6">
        
        <div class="text-center space-y-2">
          <h2 class="text-3xl font-black text-slate-900" id="pageTitle">Reset Password</h2>
          <p class="text-sm text-slate-500" id="pageSub">Enter your email to receive a password reset code</p>
        </div>

        <!-- STEP 1: Request Password Reset Code -->
        <form id="step1Form" onsubmit="handleRequestReset(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
            <input type="email" id="email" required placeholder="alextan@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-amber-500">
          </div>

          <button type="submit" id="requestBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-md transition">
            Send Reset Code
          </button>
        </form>

        <!-- STEP 2: Verify Code & Set New Password -->
        <form id="step2Form" onsubmit="handleResetPassword(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Reset Code sent to Email</label>
            <input type="text" id="resetCode" required placeholder="123456" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm tracking-widest font-bold outline-none focus:border-amber-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
            <input type="password" id="newPassword" oninput="checkPasswordStrength()" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-amber-500">
            <div class="mt-2 flex items-center gap-2">
              <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div id="strengthBar" class="h-full bg-slate-300 w-0 transition-all"></div>
              </div>
              <span id="strengthText" class="text-xs font-bold text-slate-400">Weak</span>
            </div>
          </div>

          <button type="submit" id="resetBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">
            Set New Password & Sign In
          </button>
        </form>

        <!-- Status & Error Container -->
        <div id="error-message" class="text-xs font-semibold hidden"></div>

        <!-- Back to Sign In -->
        <div class="text-center pt-2">
          <a href="signin.html" class="text-xs font-bold text-amber-600 hover:text-amber-700 transition">
            &larr; Back to Sign In
          </a>
        </div>

      </div>
    </div>
  </main>

  <script>
    // Load navigation header dynamically
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('header.html');
        if (response.ok) {
          const html = await response.text();
          document.getElementById('header-placeholder').outerHTML = html;
        }
      } catch (err) {
        console.error('Header load error:', err);
      }
    });

    window.addEventListener('load', async function () {
      await window.Clerk.load();
    });

    function checkPasswordStrength() {
      const val = document.getElementById('newPassword').value;
      const bar = document.getElementById('strengthBar');
      const txt = document.getElementById('strengthText');
      if (val.length > 8) {
        bar.style.width = '100%';
        bar.className = 'h-full bg-emerald-500 transition-all';
        txt.innerText = 'Strong';
      } else if (val.length > 4) {
        bar.style.width = '50%';
        bar.className = 'h-full bg-amber-500 transition-all';
        txt.innerText = 'Medium';
      } else {
        bar.style.width = '20%';
        bar.className = 'h-full bg-rose-500 transition-all';
        txt.innerText = 'Weak';
      }
    }

    function showError(msg, isSuccess = false) {
      const errDiv = document.getElementById('error-message');
      errDiv.innerText = msg;
      errDiv.className = isSuccess 
        ? "text-xs font-semibold text-emerald-600 bg-emerald-50 p-3 rounded-xl border border-emerald-200"
        : "text-xs font-semibold text-rose-500 bg-rose-50 p-3 rounded-xl border border-rose-200";
      errDiv.classList.remove('hidden');
    }

    // Step 1: Send reset code to email
    async function handleRequestReset(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const errDiv = document.getElementById('error-message');
      errDiv.classList.add('hidden');

      try {
        await window.Clerk.client.signIn.create({
          strategy: "reset_password_email_code",
          identifier: email,
        });

        // Switch UI to Step 2
        document.getElementById('step1Form').classList.add('hidden');
        document.getElementById('step2Form').classList.remove('hidden');
        document.getElementById('pageTitle').innerText = "Enter Reset Code";
        document.getElementById('pageSub').innerText = "Check your email inbox for the 6-digit verification code.";
        showError("Code sent! Please check your email.", true);
      } catch (err) {
        console.error("Reset request error:", err);
        showError(err.errors?.[0]?.message || "Could not find account with that email address.");
      }
    }

    // Step 2: Submit verification code & new password
    async function handleResetPassword(e) {
      e.preventDefault();
      const code = document.getElementById('resetCode').value;
      const newPassword = document.getElementById('newPassword').value;
      const errDiv = document.getElementById('error-message');
      errDiv.classList.add('hidden');

      try {
        const result = await window.Clerk.client.signIn.attemptFirstFactor({
          strategy: "reset_password_email_code",
          code: code,
          password: newPassword,
        });

        if (result.status === "complete") {
          await window.Clerk.setActive({ session: result.createdSessionId });
          showError("Password updated! Redirecting...", true);
          
          // Route user to dashboard (role read from unsafeMetadata)
          const role = result.userData?.unsafeMetadata?.role || 'parent';
          setTimeout(() => {
            if (role === 'admin') window.location.href = 'admin_dashboard.html';
            else if (role === 'driver') window.location.href = 'driver_dashboard.html';
            else window.location.href = 'parent_dashboard.html';
          }, 1200);
        } else {
          showError("Additional steps required: " + result.status);
        }
      } catch (err) {
        console.error("Password reset error:", err);
        showError(err.errors?.[0]?.message || "Invalid or expired reset code. Please try again.");
      }
    }
  </script>
</body>
</html>
