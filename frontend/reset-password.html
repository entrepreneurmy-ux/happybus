<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus | Reset Password</title>
  
  <!-- Tailwind CSS CDN & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- External CSS Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Supabase JS Client SDK & Centralized Client Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
  <script src="/assets/js/supabase-client.js"></script>
</head>
<body class="page-body">
  
  <!-- GLOBAL NAVIGATION HEADER PLACEHOLDER -->
  <div id="header-placeholder"></div>

  <main class="reset-main">
    <div class="reset-wrapper">
      <div class="reset-card">
        
        <div class="reset-header">
          <h2 class="reset-title">Reset Password</h2>
          <p id="instruction-text" class="reset-subtitle">Enter your email address and we'll send you a password reset link.</p>
        </div>

        <!-- Request Reset Form -->
        <form id="request-form" onsubmit="handlePasswordResetRequest(event)" class="reset-form">
          <div>
            <label class="reset-label">Email Address</label>
            <input type="email" id="resetEmail" required placeholder="alex@example.com" class="reset-input">
          </div>

          <!-- Error message container -->
          <div id="error-message" class="reset-error-msg hidden"></div>

          <button type="submit" class="reset-submit-btn">
            Send Reset Link
          </button>
        </form>

        <!-- New Password Form (Hidden by default, shown when user lands via recovery token link) -->
        <form id="update-form" onsubmit="handlePasswordUpdate(event)" class="reset-form hidden">
          <div>
            <label class="reset-label">New Password</label>
            <input type="password" id="newPassword" required placeholder="••••••••" class="reset-input">
          </div>

          <!-- Update Error message container -->
          <div id="update-error-message" class="reset-error-msg hidden"></div>

          <button type="submit" class="reset-submit-btn">
            Update Password
          </button>
        </form>

        <!-- Supabase Authorization Badge -->
        <div class="reset-auth-badge">
          <span>Secured by</span>
          <span class="reset-auth-brand">Supabase Auth</span>
        </div>

      </div>
    </div>
  </main>

  <script>
    // 1. Script to load the centralized header dynamically with cache-buster
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const response = await fetch('header.html?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Failed to load header.html');
        
        const html = await response.text();
        const placeholder = document.getElementById('header-placeholder');
        if (placeholder) {
          placeholder.innerHTML = html;
        }

        // Highlight active nav item based on current file name
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        document.querySelectorAll('.nav-link').forEach(link => {
          if (link.getAttribute('data-page') === currentPage) {
            link.style.backgroundColor = 'var(--color-amber-500)';
            link.style.color = 'var(--color-slate-950)';
          }
        });

        // Re-initialize Lucide icons for the injected header
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }

        // ─── MOBILE MENU TOGGLE ───
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        if (menuButton && mobileMenu) {
          menuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
          });
        }
      } catch (error) {
        console.error('Error loading navigation header:', error);
      }
    });

    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }

    // Check if the user arrived here via an email recovery link (Supabase sends recovery tokens in the URL hash)
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash && hash.includes('type=recovery')) {
        // Switch views: hide request form, show update password form
        document.getElementById('request-form').classList.add('hidden');
        document.getElementById('update-form').classList.remove('hidden');
        document.getElementById('instruction-text').innerText = "Enter your new password below.";
      }
    });

    // Step 1: Send Password Reset Request Email
    async function handlePasswordResetRequest(e) {
      e.preventDefault();
      
      const email = document.getElementById('resetEmail').value.trim();
      const errorDiv = document.getElementById('error-message');
      
      errorDiv.classList.add('hidden');

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/reset-password.html`,
        });

        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.classList.remove('hidden');
          return;
        }

        errorDiv.style.color = '#059669';
        errorDiv.innerText = "Password reset instructions have been sent to your email.";
        errorDiv.classList.remove('hidden');
      } catch (err) {
        console.error("Reset password error:", err);
        errorDiv.style.color = '#ef4444';
        errorDiv.innerText = "Something went wrong. Please try again.";
        errorDiv.classList.remove('hidden');
      }
    }

    // Step 2: Update Password (after clicking email link)
    async function handlePasswordUpdate(e) {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const errorDiv = document.getElementById('update-error-message');
      
      errorDiv.classList.add('hidden');

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) {
          errorDiv.innerText = error.message;
          errorDiv.classList.remove('hidden');
          return;
        }

        errorDiv.style.color = '#059669';
        errorDiv.innerText = "Password updated successfully! Redirecting to sign in...";
        errorDiv.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'signin.html';
        }, 2000);
      } catch (err) {
        console.error("Update password error:", err);
        errorDiv.style.color = '#ef4444';
        errorDiv.innerText = "Failed to update password.";
        errorDiv.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
