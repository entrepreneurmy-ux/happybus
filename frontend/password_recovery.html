<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyBus - Password Recovery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amber: { 50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
            slate: { 800: '#1e293b', 900: '#0f172a' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-400 flex items-center justify-center text-white shadow-md shadow-amber-500/20">
            <i data-lucide="bus" class="w-6 h-6 stroke-[2.5]"></i>
          </div>
          <span class="text-xl font-extrabold tracking-tight text-slate-900">Happy<span class="text-amber-500">Bus</span></span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow py-16">
    <div class="max-w-md mx-auto px-4">
      <div class="bg-white rounded-3xl p-8 shadow-xl border border-slate-200 space-y-6">
        <div class="text-center space-y-2">
          <h2 class="text-3xl font-black text-slate-900">Password Recovery</h2>
          <p id="forgotSubtitle" class="text-sm text-slate-500">Step 1 of 3: Enter your registered email</p>
        </div>

        <!-- Step 1 -->
        <div id="forgotStep1" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Account Email</label>
            <input type="email" id="forgotEmail" placeholder="parent@happybus.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-amber-500">
          </div>
          <button onclick="goToForgotStep(2)" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow transition">
            Send 6-Digit OTP Code
          </button>
        </div>

        <!-- Step 2 -->
        <div id="forgotStep2" class="space-y-4 hidden">
          <div class="flex justify-center gap-2">
            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-slate-50 border border-slate-300 rounded-xl">
            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-slate-50 border border-slate-300 rounded-xl">
            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-slate-50 border border-slate-300 rounded-xl">
            <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-slate-50 border border-slate-300 rounded-xl">
          </div>
          <button onclick="goToForgotStep(3)" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl shadow transition">
            Verify Code
          </button>
        </div>

        <!-- Step 3 -->
        <div id="forgotStep3" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">New Password</label>
            <input type="password" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-amber-500">
          </div>
          <button onclick="finishPasswordReset()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow transition">
            Update Password
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    function goToForgotStep(step) {
      document.getElementById('forgotStep1').classList.add('hidden');
      document.getElementById('forgotStep2').classList.add('hidden');
      document.getElementById('forgotStep3').classList.add('hidden');

      document.getElementById(`forgotStep${step}`).classList.remove('hidden');
      document.getElementById('forgotSubtitle').innerText = `Step ${step} of 3`;
    }

    function finishPasswordReset() {
      alert('Password updated successfully! Redirecting to login...');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
